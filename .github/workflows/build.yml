name: Build (Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore --runtime win-x64

      - name: Behavioral checks
        run: dotnet run --configuration Release --project tests/DatabaseTools.Checks.csproj

      - name: Publish (single file)
        run: >-
          dotnet publish DatabaseTools.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      - name: Install Velopack
        run: dotnet tool install --global vpk --version 1.2.161

      - name: Package installer and updates
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          $version = "0.0.1-ci.$env:BUILD_NUMBER"
          if ($env:RELEASE_REF_TYPE -eq 'tag') {
            if ($env:RELEASE_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
              throw 'Release tags must use vMAJOR.MINOR.PATCH, for example v1.0.0.'
            }
            $version = $Matches[1]
          }
          vpk pack --packId Kervrix.DatabaseTools --packVersion $version --packDir publish --mainExe DatabaseTools.exe --packTitle "Database Tools" --packAuthors Kervrix --icon Assets/DatabaseTools.ico --runtime win-x64 --outputDir Releases
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DatabaseTools-win
          path: |
            publish/DatabaseTools.exe
            Releases/*
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/DatabaseTools.exe
            Releases/*
          generate_release_notes: true
